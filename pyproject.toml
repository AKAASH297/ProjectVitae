[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project_vitae"
version = "0.1.0"
description = "Agent-orchestrated resume builder — clone GitHub repos, explore projects, and generate tailored resumes from a LaTeX template."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.1",
    "langchain-openai>=0.1",
    "textual>=0.50",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "mypy>=1.10",
    "ruff>=0.4",
    "psutil>=5.9",
]

[project.scripts]
project-vitae = "project_vitae.__main__:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["project_vitae*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N818"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["project_vitae/tests"]
markers = [
    "network: tests that touch the network",
]
addopts = "-p no:xdist"
