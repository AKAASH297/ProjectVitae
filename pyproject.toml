[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-vitae"
version = "0.1.0"
description = "Agent-orchestrated resume builder — clone repos, explore projects, and generate tailored resumes."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "aiosqlite>=0.20.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "textual>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["project_vitae"]

[tool.pytest.ini_options]
testpaths = ["project_vitae/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
