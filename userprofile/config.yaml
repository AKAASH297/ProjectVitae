subagents:
  explore:
    provider: anthropic
    base_url: null
    api_key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-4-6
    prompt_version: prompts/explore/v1.md
    temperature: 0.3
    max_tokens: 4096
    per_repo_token_budget: 32000

  filter:
    provider: anthropic
    base_url: null
    api_key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-4-6
    prompt_version: prompts/filter/v1.md
    temperature: 0.1
    max_tokens: 2048

  writing:
    provider: anthropic
    base_url: null
    api_key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-4-6
    prompt_version: prompts/writing/v1.md
    temperature: 0.5
    max_tokens: 8192

  content_critique:
    provider: anthropic
    base_url: null
    api_key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-4-6
    prompt_version: prompts/content_critique/v1.md
    temperature: 0.2
    max_tokens: 4096

  compile_critique:
    provider: anthropic
    base_url: null
    api_key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-4-6
    prompt_version: prompts/compile_critique/v1.md
    temperature: 0.2
    max_tokens: 4096

retry:
  max_attempts: 3
  backoff_seconds: [1, 2, 4]

cost:
  per_session_cap_usd: 5.00

latex:
  template_path: template.example.tex
  compiler: auto

log_level: info
